<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中学物理 5択クイズ</title>
  <style>
    :root {
      --primary-color: #2196F3; /* 物理分野に合わせて爽やかなブルー基調に変更 */
      --hover-color: #1976D2;
      --bg-color: #f4f7f6;
      --text-color: #333;
      --card-bg: #fff;
    }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #app {
      background: var(--card-bg);
      width: 100%;
      max-width: 600px;
      margin: 20px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }
    h1, h2 { text-align: center; }
    .hidden { display: none !important; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      background-color: var(--card-bg);
      border: 2px solid var(--primary-color);
      color: var(--primary-color);
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }
    .btn:hover { background-color: var(--primary-color); color: #fff; }
    .btn-primary {
      background-color: var(--primary-color);
      color: #fff;
      text-align: center;
      font-weight: bold;
      border: none;
    }
    .btn-primary:hover { background-color: var(--hover-color); }
    .btn:disabled { cursor: not-allowed; opacity: 0.7; }
    .correct-btn { background-color: #4CAF50 !important; color: white !important; border-color: #4CAF50 !important; }
    .wrong-btn { background-color: #f44336 !important; color: white !important; border-color: #f44336 !important; }
    #progress { text-align: center; font-weight: bold; margin-bottom: 20px; color: #666; }
    #question-text { font-size: 18px; line-height: 1.6; margin-bottom: 25px; }
    #explanation-box {
      margin-top: 20px;
      padding: 15px;
      background-color: #e3f2fd;
      border-left: 5px solid var(--primary-color);
      border-radius: 4px;
    }
    .score-display { font-size: 24px; text-align: center; margin: 20px 0; font-weight: bold; }
    .high-score { text-align: center; font-size: 14px; color: #777; margin-top: 10px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="start-screen">
      <h1>中学物理 5択クイズ</h1>
      <p style="text-align: center;" id="start-description">全60問の中からランダムに10問出題されます</p>
      <div class="high-score" id="high-score-display">過去の最高得点: -- 点</div>
      <button class="btn btn-primary" onclick="startQuiz()" style="margin-top: 30px;">クイズを始める</button>
    </div>

    <div id="quiz-screen" class="hidden">
      <div id="progress">問題 1 / 10</div>
      <div id="question-text"></div>
      <div id="options-container"></div>

      <div id="explanation-box" class="hidden">
        <h3 id="result-title" style="margin-top: 0;"></h3>
        <p id="explanation-text"></p>
        <button class="btn btn-primary" onclick="nextQuestion()" style="margin-top: 15px;">次の問題へ</button>
      </div>
    </div>

    <div id="result-screen" class="hidden">
      <h1>結果発表</h1>
      <div class="score-display" id="final-score"></div>
      <div class="high-score" id="new-high-score-msg" class="hidden" style="color: #d32f2f; font-weight: bold;"></div>
      <button class="btn btn-primary" onclick="resetQuiz()" style="margin-top: 30px;">トップに戻る</button>

    const QUESTION_COUNT = 10;
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let isAnswered = false;

    window.onload = () => {
      const storageKey = 'quizHighScore_中学物理 5択クイズ';
      const highScore = localStorage.getItem(storageKey) || 0;
      document.getElementById('high-score-display').innerText = `過去の最高得点: ${highScore}点`;
    };

    function startQuiz() {
      currentQuestions = [...allQuizData].sort(() => 0.5 - Math.random()).slice(0, QUESTION_COUNT);
      currentQuestionIndex = 0;
      score = 0;

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');

      showQuestion();
    }

    function showQuestion() {
      isAnswered = false;
      document.getElementById('explanation-box').classList.add('hidden');

      const q = currentQuestions[currentQuestionIndex];
      document.getElementById('progress').innerText = `問題 ${currentQuestionIndex + 1} / ${currentQuestions.length} （${q.unit}）`;
      document.getElementById('question-text').innerText = q.question;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      q.options.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = option;
        btn.onclick = () => checkAnswer(index, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedIndex, selectedBtn) {
      if (isAnswered) return;
      isAnswered = true;

      const q = currentQuestions[currentQuestionIndex];
      const buttons = document.getElementById('options-container').querySelectorAll('button');

      buttons.forEach((btn, index) => {
        btn.disabled = true;
        if (index === q.answerIndex) {
          btn.classList.add('correct-btn');
        } else if (index === selectedIndex) {
          btn.classList.add('wrong-btn');
        }
      });

      const title = document.getElementById('result-title');
      if (selectedIndex === q.answerIndex) {
        title.innerText = "⭕ 正解！";
        title.style.color = "#4CAF50";
        score++;
      } else {
        title.innerText = "❌ 不正解...";
        title.style.color = "#f44336";
      }

      document.getElementById('explanation-text').innerText = q.explanation;
      document.getElementById('explanation-box').classList.remove('hidden');
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < currentQuestions.length) {
        showQuestion();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');

      document.getElementById('final-score').innerText = `${currentQuestions.length}問中 ${score}問正解！`;

      const storageKey = 'quizHighScore_中学物理 5択クイズ';
      const currentHighScore = parseInt(localStorage.getItem(storageKey) || 0);
      const msgElement = document.getElementById('new-high-score-msg');

      if (score > currentHighScore) {
        localStorage.setItem(storageKey, score);
        msgElement.innerText = "🎉 最高得点を更新しました！";
        msgElement.classList.remove('hidden');
      } else {
        msgElement.classList.add('hidden');
      }
    }

    function resetQuiz() {
      const storageKey = 'quizHighScore_中学物理 5択クイズ';
      const highScore = localStorage.getItem(storageKey) || 0;
      document.getElementById('high-score-display').innerText = `過去の最高得点: ${highScore}点`;

      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    }
